    <main class="fade-in">
      <!-- section card -->
      <div class="card-container-about-me">
        <div class="card-about-me">
          <div class="card-content-about-me">
            <center>
              <h2>contact</h2>
              <p>Get in touch with me!</p>
            </center>
          </div>
        </div>
      </div>
      <!-- 1 Contact  Card -->
      <div class="card-container-about-me">
        <div class="card-about-me">
          <img
            class="img1"
            src="./media/biljast-iphone-x-4038013_1280.jpg"
            alt="contact image"
          />
          <div class="card-content-about-me">
            <center>
              <section id="contact-sectie">
                <h2>contact me</h2>
                <div
                  id="form-status"
                  aria-live="polite"
                  class="success-message"
                ></div>
                <form id="contact-form" novalidate>
                  <div class="form-group">
                    <label for="naam">name:</label>
                    <input
                      type="text"
                      id="naam"
                      name="naam"
                      required
                      minlength="2"
                      aria-describedby="naam-error"
                    />
                    <span
                      id="naam-error"
                      class="error-message"
                      aria-live="polite"
                    ></span>
                  </div>
                  <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input
                      type="email"
                      id="email"
                      name="email"
                      required
                      aria-describedby="email-error"
                    />
                    <span
                      id="email-error"
                      class="error-message"
                      aria-live="polite"
                    ></span>
                  </div>
                  <div class="form-group">
                    <label for="bericht">message:</label>
                    <textarea
                      id="bericht"
                      name="bericht"
                      required
                      minlength="10"
                      aria-describedby="bericht-error"
                    ></textarea>
                    <span
                      id="bericht-error"
                      class="error-message"
                      aria-live="polite"
                    ></span>
                  </div>
                  <button class="btn" type="submit">sent</button>
                </form>
              </section>
            </center>
          </div>
        </div>
      </div>
    </main>
